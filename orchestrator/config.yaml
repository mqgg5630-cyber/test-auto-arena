topic: "AI 自循环任务系统 - 自动化文档生成与本地打通"
max_iterations: 5
quality_threshold: 85
output_dir: "output"
local_dir: "local"
status_dir: "status"
branch: "arena/01a0a93d-test-auto-arena"
source_agent: "https://arena.ai/agent/01a0a821-3f3c-7bbe-bf99-6e6793c45d81"

# 自循环策略
loop_strategy:
  growth_per_iteration: "每次迭代内容深度 +10%，幻灯片 +2"
  evaluation_weights:
    docx: 0.6
    pptx: 0.4
  termination:
    - score >= threshold
    - iteration >= max_iterations

# 本地打通配置
local_bridge:
  inbox: "local/inbox"
  outbox: "local/outbox"
  receipts: "local/status_receipts"
  git_auto_push: true
  copy_final_and_versioned: true

# 文档生成配置
docx:
  style: "professional"
  include_toc: true
  include_metrics_table: true
  include_architecture: true
  min_paragraphs: 30
  min_headings: 5

pptx:
  slide_width: 13.333
  slide_height: 7.5
  min_slides: 10
  include_table: true
  include_metrics: true
